name: Contribution snake

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 02:17 UTC
  workflow_dispatch:

concurrency:
  group: snake
  cancel-in-progress: true

permissions:
  contents: write   # needed to push the generated SVGs to the "output" branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        run: |
          set -euo pipefail
          for f in dist/github-snake.svg dist/github-snake-dark.svg; do
            test -s "$f" || { echo "::error::Expected $f was not generated by Platane/snk"; exit 1; }
          done
          mkdir -p /tmp/snake && cp dist/*.svg /tmp/snake/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch --depth=1 origin output
            git checkout -f -B output FETCH_HEAD
          else
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf dist
          cp /tmp/snake/github-snake.svg /tmp/snake/github-snake-dark.svg .
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Snake output unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update contribution snake"
          git push origin output
